<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>U.E.E Carmen Ruíz - Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            background: linear-gradient(rgba(10, 10, 10, 0.6), rgba(10, 10, 10, 0.7)),
            url("{{ url_for('static', filename='fondo_escuela.jpg') }}") no-repeat center center fixed;
            background-size: cover;
        }

        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #FFF;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85em;
            margin-bottom: 5px;
            color: #00E5FF;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            background: #1A1A1A;
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 4px;
            color: #FFF;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #00E5FF;
            color: #0A0A0A;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: #0077CC;
            color: #FFF;
        }

        .alert {
            padding: 10px;
            background: rgba(0, 229, 255, 0.2);
            border: 1px solid #00E5FF;
            color: #00E5FF;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2 style="text-align:center; margin-bottom:20px;">Registro de Estudiantes</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/prueba1">
            <div class="form-grid">
                <div class="form-group">
                    <label>Cédula</label>
                    <input type="text" name="cedula" required>
                </div>
                <div class="form-group">
                    <label>Nacionalidad</label>
                    <input type="text" name="nacionalidad" placeholder="Ej: Venezolana" required>
                </div>
                <div class="form-group">
                    <label>Nombres</label>
                    <input type="text" name="nombres" required>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" name="apellidos" required>
                </div>
                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" name="fecha_nacimiento" required>
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <select name="genero" required>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono">
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" name="correo">
                </div>
                <div class="form-group">
                    <label>Estado Matricular</label>
                    <select name="estado">
                        <option value="A">Activo</option>
                        <option value="I">Inactivo</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-bottom:20px;">
                <label>Dirección</label>
                <textarea name="direccion" rows="2"></textarea>
            </div>
            <button type="submit" class="btn-submit">Guardar Estudiante</button>
        </form>
    </div>

</body>

</html>
