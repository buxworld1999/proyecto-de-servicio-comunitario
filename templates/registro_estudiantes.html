<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>U.E.E Carmen Ruíz - Registro</title>
    <link rel="icon" href="static/fondo_escuela.jpg" type="image/png">
    <link rel="stylesheet" href="static/registro_estu.css">

<body>

    <div class="form-container">
        <h2 style="text-align:center; margin-bottom:20px;">Registro de Estudiantes</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/registro_estu">
            <div class="form-grid">
                <div class="form-group">
                    <label>Cédula</label>
                    <input type="text" name="cedula" required>
                </div>
                <div class="form-group">
                    <label>Nacionalidad</label>
                    <input type="text" name="nacionalidad" placeholder="Ej: Venezolana" required>
                </div>
                <div class="form-group">
                    <label>Nombres</label>
                    <input type="text" name="nombres" required>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" name="apellidos" required>
                </div>
                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" name="fecha_nacimiento" required>
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <select name="genero" required>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono">
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" name="correo">
                </div>
                <div class="form-group">
                    <label>Estado Matricular</label>
                    <select name="estado">
                        <option value="A">Activo</option>
                        <option value="I">Inactivo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Año de Estudio</label>
                    <select name="anio" required>
                        <option value="1er Año">1er Año</option>
                        <option value="2do Año">2do Año</option>
                        <option value="3er Año">3er Año</option>
                        <option value="4to Año">4to Año</option>
                        <option value="5to Año">5to Año</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sección</label>
                    <select name="seccion" required>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-bottom:20px;">
                <label>Dirección</label>
                <textarea name="direccion" rows="2"></textarea>
            </div>
            <button type="submit" class="btn-submit">Guardar Estudiante</button>
        </form>
    </div>

</body>

</html>
