<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ nombre }} — PRISMA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
            color: #1e293b;
        }
        .container {
            text-align: center;
            padding: 60px 50px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(37,99,235,0.08);
            max-width: 420px;
            width: 90%;
            border: 1px solid #e0e7ff;
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-wrap i {
            font-size: 38px;
            color: #2563eb;
        }
        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fef3c7;
            color: #d97706;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #fde68a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <i class="fa-solid {{ icono }}"></i>
        </div>
        <h2>{{ nombre }}</h2>
        <p>Este módulo está en construcción y estará disponible próximamente en PRISMA.</p>
        <div class="badge">
            <i class="fa-solid fa-hammer"></i>
            En Desarrollo
        </div>
    </div>
</body>
</html>
