<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA - Reportes Institucionales</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Encabezado Institucional */
        .header-institucional {
            text-align: center;
            border-bottom: 3px double var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .header-institucional h1 {
            color: var(--primary-color);
            margin: 5px 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header-institucional p {
            margin: 2px 0;
            color: #64748b;
            font-size: 14px;
        }

        /* Panel de Control de Reportes */
        .grid-reportes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card-reporte {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-reporte:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            color: var(--primary-color);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Formularios y Filtros */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Botones Administrativos */
        .btn-generar {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-generar:hover {
            background-color: var(--secondary-color);
        }

        .btn-regresar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-regresar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card-reporte">
        <div class="card-title">
            <i class="fa-solid fa-file-signature"></i> Reporte de Matrícula
        </div>
        <p style="font-size: 13px; color: #64748b; margin-top: 0;">Genera listados oficiales de alumnos registrados.</p>
        <form action="{{ url_for('reportes') }}" method="POST">
            <input type="hidden" name="accion" value="matricula">

            <div class="form-group">
                <label>Año Escolar</label>
                <select class="form-control" name="anio_lectivo" required>
                    <option value="2025-2026">2025 - 2026</option>
                </select>
            </div>
            <div class="form-group">
                <label>Año / Grado</label>
                <select class="form-control" name="grado">
                    <option value="todos">Todos los alumnos</option>
                </select>
            </div>
            <button type="submit" class="btn-generar">
                <i class="fa-solid fa-magnifying-glass"></i> Consultar Matrícula
            </button>
        </form>
    </div>

    <div class="card-reporte">
        <div class="card-title">
            <i class="fa-solid fa-file-circle-check"></i> Constancias Automatizadas
        </div>
        <p style="font-size: 13px; color: #64748b; margin-top: 0;">Genera un documento oficial imprimible
            inmediatamente.</p>
        <form action="{{ url_for('reportes') }}" method="POST" target="_blank">
            <input type="hidden" name="accion" value="constancia">

            <div class="form-group">
                <label>Cédula del Estudiante</label>
                <input type="text" class="form-control" name="cedula_buscar" placeholder="Ej. V-30123456" required>
            </div>
            <div class="form-group">
                <label>Motivo de Emisión</label>
                <input type="text" class="form-control" name="motivo" placeholder="Ej. Inscripción / Seguro Social">
            </div>
            <button type="submit" class="btn-generar" style="background-color: #10b981;">
                <i class="fa-solid fa-print"></i> Generar e Imprimir
            </button>
        </form>
    </div>

</body>

</html>
